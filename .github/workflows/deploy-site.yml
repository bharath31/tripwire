name: Legacy Cloudflare rollback

# Kept temporarily as a manual rollback path while production moves to Vercel.
# The Next.js application deploys through Vercel's Git integration.
on:
  workflow_dispatch:

concurrency:
  group: deploy-site
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
        with:
          # Last known-good static site. The live D1 data remains untouched.
          ref: fa17ad017d7dc07a70a4c0da487d2f74bf94dc29
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the legacy browser bundle
        run: npm run build:web
      - name: Publish to Cloudflare Pages
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        run: npx --yes wrangler@4 pages deploy --branch=main
      - name: Note missing token
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' }}
        run: echo "::warning::Cloudflare rollback token is not configured."
